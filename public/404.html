<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriGuard AI</title>
    <script>
      // Single Page App redirect for GitHub Pages
      const path = window.location.pathname;
      const base = '/VeriGuard-AI-app/';
      if (path !== base && path !== base.slice(0, -1)) {
        window.location.replace(base + '?redirect=' + encodeURIComponent(path));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
